workflows:
  ios-native-quick-start:
    name: iOS Native
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: 'Regrowth Clock'
    environment:
      # Подпись берётся из хранилища Codemagic (Settings → Code signing
      # identities): distribution-сертификат «Regrowth Clock 2026» лежит там
      # вместе с приватным ключом, одноимённый provisioning profile выпущен
      # под него и подтянут из портала. Один сертификат обслуживает все
      # сборки.
      #
      # Прежняя схема генерировала ключ заново на каждой сборке
      # (openssl genrsa) — сертификат оставался, а ключа к нему больше не
      # было, поэтому каждый запуск просил у Apple новый и упирался в лимит:
      # «You already have a current Distribution certificate», 409.
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.tobiaslauridsen.regrowthclock
      vars:
        BUNDLE_ID: "com.tobiaslauridsen.regrowthclock"
        XCODE_WORKSPACE: "Regrowth Clock.xcodeproj"
        XCODE_SCHEME: "Regrowth Clock"
        APP_STORE_APPLE_ID: 6804659766
      xcode: latest
    scripts:
      - name: Set up provisioning profiles settings on Xcode project
        script: xcode-project use-profiles
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
